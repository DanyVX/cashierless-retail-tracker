repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff lint
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format check
        entry: ruff format --check
        language: system
        types: [python]
      - id: detect-secrets
        name: detect-secrets (staged content)
        entry: detect-secrets-hook
        language: system
        types: [text]
