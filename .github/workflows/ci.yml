name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Update vulnerable build dependency
        run: python -m pip install --upgrade setuptools==83.0.0
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src/crt
      - name: Unit tests and coverage
        run: pytest --cov=crt --cov-report=term-missing --cov-fail-under=70 -m 'not slow and not gpu'
      - name: Dependency audit
        run: pip-audit
      - name: Smoke environment snapshot
        run: crt-env --output env-report.json
      - name: Synthetic decoder smoke benchmark
        run: python bench/bench_video.py --frames 5 --out results/ci-smoke.json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
