[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cashierless-retail-tracker"
version = "0.0.1"
description = "Privacy-first mock-shelf cashierless retail perception research prototype"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Danial Hassan"}]
dependencies = [
    "pydantic==2.13.5",
    "pydantic-settings==2.14.2",
]

[project.optional-dependencies]
dev = [
    "ruff==0.13.3",
    "mypy==1.18.2",
    "pytest==9.0.3",
    "pytest-cov==7.0.0",
    "hypothesis==6.140.0",
    "pre-commit==4.3.0",
    "detect-secrets==1.5.0",
    "pip-audit==2.9.0",
]
video = ["opencv-python-headless==4.13.0.92", "numpy==2.3.5"]

[project.scripts]
crt-env = "crt.environment:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crt"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src/crt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: opt-in long-running tests",
    "gpu: opt-in GPU tests",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["crt"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 70
